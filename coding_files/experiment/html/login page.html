<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grocery Store Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f9ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 360px;
    }
    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0077ff;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 15px;
    }
    .options input[type="checkbox"] {
      margin-right: 5px;
    }
    .options a {
      color: #0077ff;
      text-decoration: none;
    }
    .options a:hover {
      text-decoration: underline;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #0077ff, #3399ff);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .divider {
      text-align: center;
      margin: 20px 0;
      position: relative;
    }
    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ccc;
    }
    .divider::before {
      left: 0;
    }
    .divider::after {
      right: 0;
    }
    .divider span {
      background: #fff;
      padding: 0 10px;
      color: #666;
      font-size: 13px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      background: white;
    }
    .social-btn img {
      height: 18px;
      margin-right: 10px;
    }
    .register {
      text-align: center;
      font-size: 14px;
      margin-top: 10px;
    }
    .register a {
      color: #0077ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Grocery Store</h2>
    
    <div class="input-group">
      <input type="email" placeholder="Email" required>
    </div>
    <div class="input-group">
      <input type="password" placeholder="Password" required>
    </div>
    
    <div class="options">
      <label><input type="checkbox"> Remember me</label>
      <a href="#">Forgot Password?</a>
    </div>
    
    <button class="login-btn">Sign in</button>
    
    <div class="divider"><span>OR</span></div>
    
    <div class="social-btn">
      <img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook" />
      Login with Facebook
    </div>
    <div class="social-btn">
      <img src="https://img.icons8.com/color/48/google-logo.png" alt="Gmail" />
      Login with Gmail
    </div>
    <div class="social-btn">
      <img src="https://img.icons8.com/color/48/twitter--v1.png" alt="Twitter" />
      Login with Twitter
    </div>
    
    <div class="register">
      Don’t have an account? <a href="#">Register Now</a>
    </div>
  </div>
</body>
</html>
